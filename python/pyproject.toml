[project]
name = "hron"
version = "1.0.0"
description = "Human-readable cron — a scheduling expression language that is a superset of cron"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["cron", "schedule", "human-readable", "hron"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = ["tzdata>=2024.1"]

[project.urls]
Homepage = "https://github.com/simpllyf/hron"
Repository = "https://github.com/simpllyf/hron"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16", "ty==0.0.84"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
