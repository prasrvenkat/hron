name: Java

on:
  push:
    branches: [main]
    paths: ["java/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/java.yml"]
  pull_request:
    paths: ["java/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/java.yml"]

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: jdx/mise-action@v5
        with:
          install_args: just
      - name: Format check
        run: just lint-java

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: jdx/mise-action@v5
        with:
          install_args: just
      - name: Build
        run: just build-java
      - name: Test
        run: just test-java
      - name: Build release artifacts (unsigned)
        run: cd java && mvn -B -P release -Dgpg.skip -DskipTests verify
