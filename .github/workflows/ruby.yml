name: Ruby

on:
  push:
    branches: [main]
    paths: ["ruby/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/ruby.yml"]
  pull_request:
    paths: ["ruby/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/ruby.yml"]

env:
  BUNDLE_FROZEN: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: ruby just
      - name: Test
        run: just test-ruby
      - name: Build gem
        run: cd ruby && gem build hron.gemspec

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: ruby just
      - name: Install dependencies
        run: bundle install
        working-directory: ruby
      - name: Lint
        run: just lint-ruby
