name: Playground

on:
  push:
    branches: [main]
    paths:
      - "playground/**"
      - ".tool-versions"
      - ".mise.toml"
      - ".github/workflows/playground-ci.yml"
  pull_request:
    paths:
      - "playground/**"
      - ".tool-versions"
      - ".mise.toml"
      - ".github/workflows/playground-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: nodejs pnpm

      - name: Install dependencies
        run: cd playground && pnpm install --frozen-lockfile

      - name: Typecheck
        run: cd playground && pnpm typecheck

      - name: Build
        run: cd playground && pnpm build

      - name: Check both pages were built
        run: test -f playground/dist/index.html && test -f playground/dist/playground/index.html
