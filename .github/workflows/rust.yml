name: Rust

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "spec/**"
      - "justfile"
      - ".tool-versions"
      - ".mise.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "spec/**"
      - "justfile"
      - ".tool-versions"
      - ".mise.toml"
      - ".github/workflows/rust.yml"

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust just
      - run: rustup component add rustfmt clippy
      - run: just lint-rust

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - name: Check hron builds on its declared rust-version
        run: |
          msrv=$(grep '^rust-version' rust/hron/Cargo.toml | cut -d'"' -f2)
          mise install "rust@$msrv"
          mise exec "rust@$msrv" -- cargo check --locked -p hron --manifest-path rust/Cargo.toml

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust just
      - run: just test-rust

  wasm:
    name: WASM Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust nodejs pnpm
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack
      - run: wasm-pack build --release
        working-directory: rust/wasm
      - run: cp rust/wasm/hron_wasm_entry.js rust/wasm/pkg/hron_wasm.js
      - run: pnpm install --frozen-lockfile && pnpm test
        working-directory: rust/wasm/test
