name: Go

on:
  push:
    branches: [main]
    paths: ["go/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/go.yml"]
  pull_request:
    paths: ["go/**", "spec/**", "justfile", ".tool-versions", ".mise.toml", ".github/workflows/go.yml"]

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go just
      - name: Format & Lint
        run: just lint-go

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go just
      - name: Build
        run: just build-go
      - name: Test
        run: just test-go
