name: Python

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "spec/**"
      - "justfile"
      - ".tool-versions"
      - ".mise.toml"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "spec/**"
      - "justfile"
      - ".tool-versions"
      - ".mise.toml"
      - ".github/workflows/python.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - uses: jdx/mise-action@v5
        with:
          install_args: just

      - name: Install dependencies
        run: cd python && uv sync --locked

      - name: Verify interpreter matches matrix
        run: cd python && uv run python -c "import sys; assert sys.version.startswith('${{ matrix.python-version }}.'), sys.version"

      - name: Format & Lint
        run: just lint-python

      - name: Test
        run: just test-python

      - name: Build
        run: cd python && uv build
